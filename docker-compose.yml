services:
  postgres:
    image: postgres:16-alpine
    container_name: sim_alfida_postgres
    restart: always
    environment:
      POSTGRES_USER: sim_user
      POSTGRES_PASSWORD: sim_password
      POSTGRES_DB: sim_alfida_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim_user -d sim_alfida_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sim_alfida_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
