version: '3.8'

services:
  # 1. Database PostgreSQL Lokal
  db:
    image: postgres:15-alpine
    container_name: sim-alfida-db
    restart: always
    environment:
      POSTGRES_USER: alfida
      POSTGRES_PASSWORD: 4dmin4lfid4
      POSTGRES_DB: alfida
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Aplikasi NestJS (API)
  api:
    build:
      context: ./apps/api
      dockerfile: ../../Dockerfile
    container_name: sim-alfida-api
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - db
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://alfida:4dmin4lfid4@db:5432/alfida

  # 3. Sinkronisasi Skema Database Otomatis (Prisma DB Push)
  migrate:
    build:
      context: .
      target: builder
    container_name: sim-alfida-migrate
    command: sh -c "corepack enable pnpm && pnpm --filter @sim/database prisma db push --accept-data-loss"
    environment:
      - DATABASE_URL=postgresql://alfida:4dmin4lfid4@db:5432/alfida
      - DIRECT_URL=postgresql://alfida:4dmin4lfid4@db:5432/alfida
    depends_on:
      - db

  # 4. Aplikasi Next.js (Frontend)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sim-alfida-app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://api:3001
      # Supabase Auth tetap membaca dari .env untuk Manajemen Autentikasi
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}


  # 5. MinIO Object Storage Lokal (Pengganti Cloudinary)
  minio:
    image: minio/minio
    container_name: sim-alfida-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-createbucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb myminio/sim-alfida || true;
      /usr/bin/mc anonymous set public myminio/sim-alfida || true;
      exit 0;
      "

volumes:
  pgdata:
  minio_data:
