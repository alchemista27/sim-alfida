<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIM-Alfida - Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    :root {
      --color-primary: #454545;
      --color-secondary: #06bfa2;
      --color-tertiary: #0f7f6d;
      --color-on-tertiary: #F7F8F8;
      --color-neutral: #F7F8F8;
      --color-surface: #FFFFFF;
      --color-border: #E3E8E7;
      --font-heading: 'Roboto', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius-sm: 4px;
      --radius-md: 8px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); color: var(--color-primary); background: var(--color-neutral); min-height: 100vh; display: flex; }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); }
    .split-layout { display: flex; width: 100%; min-height: 100vh; }
    .panel-left {
      width: 40%;
      background: linear-gradient(135deg, var(--color-tertiary), var(--color-secondary));
      color: var(--color-on-tertiary);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      text-align: center;
      position: fixed;
      height: 100vh;
    }
    .panel-left h1 { font-size: 2.5rem; margin-bottom: var(--spacing-md); }
    .panel-left p { font-size: 1.1rem; opacity: 0.9; }
    .panel-right {
      width: 60%;
      margin-left: 40%;
      background: var(--color-surface);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }
    .register-container { width: 100%; max-width: 400px; }
    .register-container h2 { font-size: 1.8rem; margin-bottom: var(--spacing-lg); color: var(--color-primary); }
    .form-group { margin-bottom: var(--spacing-md); }
    .form-group label { display: block; margin-bottom: var(--spacing-sm); font-weight: 500; font-size: 0.9rem; }
    .form-group input { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid var(--color-border); 
      border-radius: var(--radius-sm); 
      font-family: var(--font-body);
      font-size: 1rem;
    }
    .password-strength {
      height: 4px;
      background: var(--color-border);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .password-strength-bar {
      height: 100%;
      width: 33%;
      background: #f44336;
      transition: width 0.3s ease, background 0.3s ease;
    }
    .password-strength-text {
      font-size: 0.8rem;
      color: #888;
      margin-top: 4px;
      display: block;
    }
    .btn-primary {
      width: 100%;
      background: var(--color-tertiary);
      color: var(--color-on-tertiary);
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: var(--spacing-md);
    }
    .text-center { text-align: center; margin-top: var(--spacing-lg); }
    a { color: var(--color-tertiary); text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    @media (max-width: 768px) {
      .split-layout { flex-direction: column; }
      .panel-left { width: 100%; height: 30vh; position: relative; padding: 20px; }
      .panel-right { width: 100%; margin-left: 0; align-items: flex-start; padding-top: 40px; }
    }
  </style>
</head>
<body>
  <div class="split-layout">
    <div class="panel-left">
      <h1>SIM-Alfida</h1>
      <p>Sistem Informasi Manajemen Yayasan Alfida</p>
    </div>
    <div class="panel-right">
      <div class="register-container">
        <h2>Daftar Akun Orang Tua</h2>
        <form action="03-modules.html" method="GET">
          <div class="form-group">
            <label for="fullname">Nama Lengkap *</label>
            <input type="text" id="fullname" placeholder="Masukkan nama lengkap" required>
          </div>
          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" placeholder="Contoh: ahmad@email.com" required>
          </div>
          <div class="form-group">
            <label for="phone">No. WA/HP *</label>
            <input type="tel" id="phone" placeholder="Contoh: 08123456789" required>
          </div>
          <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" placeholder="Buat password" required>
            <div class="password-strength">
              <div class="password-strength-bar"></div>
            </div>
            <span class="password-strength-text">Kekuatan: Lemah</span>
          </div>
          <div class="form-group">
            <label for="confirm_password">Konfirmasi Password *</label>
            <input type="password" id="confirm_password" placeholder="Ulangi password" required>
          </div>
          <button type="submit" class="btn-primary">Daftar</button>
        </form>
        <div class="text-center">
          <a href="01-login.html">Sudah punya akun? Masuk</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
